[project]
name = "garmin-lakehouse"
version = "0.1.0"
description = "Bronze/silver/gold lakehouse for Garmin Connect health data on Databricks"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark`/`dbutils` are injected, imports follow
# setup cells (%pip, sys.path), and %md cells hold long markdown table rows.
"pipelines/*.py" = ["E402", "F821", "E501"]
"notebooks/*.py" = ["E402", "F821", "E501"]
