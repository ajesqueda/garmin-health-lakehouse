# Databricks Asset Bundle: everything this project creates in the workspace.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run garmin_daily
bundle:
  name: garmin-health-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition workspaces come with `workspace`)
    default: workspace
  schema:
    default: garmin
  secret_scope:
    description: Secret scope holding Garmin credentials (see docs/setup.md)
    default: garmin

resources:
  schemas:
    garmin:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Garmin Connect health data, bronze/silver/gold

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.garmin.name}
      name: landing
      volume_type: MANAGED
      comment: Raw JSON files from Garmin Connect, one per endpoint per day

  pipelines:
    garmin_medallion:
      name: garmin-medallion
      catalog: ${var.catalog}
      schema: ${resources.schemas.garmin.name}
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: ./pipelines/garmin_pipeline.py
      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
        garmin.landing_path: /Volumes/${var.catalog}/${resources.schemas.garmin.name}/landing

  jobs:
    garmin_daily:
      name: garmin-daily
      schedule:
        # Every day at 6:00 AM Central time.
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest
          environment_key: ingest_env
          spark_python_task:
            python_file: ./scripts/ingest_job.py
            parameters:
              - --src
              - ${workspace.file_path}/src
              - --landing
              - /Volumes/${var.catalog}/${resources.schemas.garmin.name}/landing
              - --secret-scope
              - ${var.secret_scope}
              - --days
              - "7"
              - --timezone
              - America/Chicago
        - task_key: medallion
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.garmin_medallion.id}
      environments:
        - environment_key: ingest_env
          spec:
            # Serverless environment 4 runs Python 3.12; garminconnect needs >= 3.12.
            environment_version: "4"
            dependencies:
              - garminconnect==0.3.20

targets:
  free:
    default: true
    workspace:
      # CLI profile created with `databricks auth login --profile free`
      profile: free
      root_path: ~/.bundle/${bundle.name}
